# What each tool of the Math Box menu does.
about:
  DiceRoll: Tung một đến ba con xúc xắc, tối đa 250 lần, và đếm kết quả.
  CoinToss: Tung một đến ba đồng xu, tối đa 250 lần, và đếm số mặt ngửa.
  NumberLine: Vẽ tối đa ba bất đẳng thức trên trục số.
  Circle: Một góc trên đường tròn đơn vị cùng sin, cos và tan của nó, hoặc hai kim đồng hồ.


