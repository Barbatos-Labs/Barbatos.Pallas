name: barbatos-pallas-cd-nuget

# Publishes the two packages, as Barbatos.i18n and Barbatos.Wpf publish theirs (docs/RELEASING.md).
on:
  # When a GitHub Release is published
  release:
    types: [published]
  # By hand from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    # A release tagged app-v... is the app's, published by barbatos-pallas-release-app.yml
    if: ${{ !startsWith(github.event.release.tag_name, 'app-') }}
    runs-on: windows-latest
    environment: production

    # The OIDC token NuGet trusted publishing exchanges for a short-lived key
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The core libraries target net8.0, net9.0 and net10.0, and the tests run on all three
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # src/core/Directory.Build.props strong-names every core library once this file exists
      - name: Write the strong-name key
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY)) {
            Write-Error "STRONG_NAME_KEY secret is not set or is empty."
            exit 1
          }
          $key = [System.Convert]::FromBase64String($env:STRONG_NAME_KEY)
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) "src\barbatos.snk"), $key)
          Write-Host "Strong-name key written ($($key.Length) bytes)"

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: phamhung

      - name: Restore
        run: dotnet restore Barbatos.Pallas.slnx

      - name: Build
        run: dotnet build Barbatos.Pallas.slnx --configuration Release --no-restore

      # A release must not reach nuget.org with failing tests: a published version cannot be taken back.
      - name: Test
        run: dotnet test --solution Barbatos.Pallas.slnx --configuration Release --no-build

      # IsPackable decides what comes out: only Engine and DependencyInjection
      - name: Pack
        run: dotnet pack Barbatos.Pallas.slnx --configuration Release --output artifacts/packages

      # --skip-duplicate: a version already on nuget.org cannot be pushed again, so it is passed over
      - name: Publish the packages to NuGet.org
        run: dotnet nuget push artifacts\packages\*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Publish the symbols to NuGet.org
        run: dotnet nuget push artifacts\packages\*.snupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts\packages\*
