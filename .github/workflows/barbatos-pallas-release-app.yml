name: barbatos-pallas-release-app

# Builds the signed installer of the app and publishes it as a GitHub Release (docs/RELEASING.md). The packages are
# released apart, by barbatos-pallas-cd-nuget.yml.
#
# barbatos-pack is the tool of Barbatos.PackagingEngine, a private repository whose reusable workflows a public
# repository such as this one may not call, so it is installed here from the private feed.
on:
  # When a tag app-v<version> is pushed
  push:
    tags:
      - 'app-v*'
  # By hand from the Actions tab: the installer as the run's artifact, and no release
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    environment: production

    # Creating the release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # The strong-name key for the libraries, as the packages are signed, and the code-signing certificate
      - name: Write the keys
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
          SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRONG_NAME_KEY)) { Write-Error "STRONG_NAME_KEY secret is not set or is empty."; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PFX)) { Write-Error "SIGNING_CERTIFICATE_PFX secret is not set or is empty."; exit 1 }
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) "src\barbatos.snk"), [System.Convert]::FromBase64String($env:STRONG_NAME_KEY))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) "packaging\certificates\barbatos-codesign.pfx"), [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))

      # signtool verifies each signature up to a root this machine trusts, and a new runner does not know the Barbatos
      # Labs root: without it the files sign and verification fails (measured on Barbatos.RMCP).
      - name: Trust the Barbatos Labs root
        run: |
          $root = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 (Join-Path (Get-Location) "packaging\certificates\barbatos-ca.cer")
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "Root", "LocalMachine"
          $store.Open("ReadWrite")
          $store.Add($root)
          $store.Close()

      # Into a folder of its own, with a NuGet config of its own that holds the feed token, so that this repository's
      # nuget.config stays nuget.org only for everyone who builds it.
      - name: Install barbatos-pack
        env:
          BARBATOS_PACKAGES_TOKEN: ${{ secrets.BARBATOS_PACKAGES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BARBATOS_PACKAGES_TOKEN)) { Write-Error "BARBATOS_PACKAGES_TOKEN secret is not set or is empty."; exit 1 }
          $config = Join-Path $env:RUNNER_TEMP "barbatos-internal.nuget.config"
          Set-Content -Path $config -Value @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="barbatos-internal" value="https://nuget.pkg.github.com/Barbatos-Labs/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <barbatos-internal>
                <add key="Username" value="github-actions" />
                <add key="ClearTextPassword" value="$env:BARBATOS_PACKAGES_TOKEN" />
              </barbatos-internal>
            </packageSourceCredentials>
          </configuration>
          "@
          dotnet tool install Barbatos.PackagingEngine.Cli --version 1.0.0 --tool-path "$env:RUNNER_TEMP\barbatos-pack" --configfile $config
          $installed = $LASTEXITCODE
          Remove-Item $config
          if ($installed -ne 0) { exit $installed }
          "$env:RUNNER_TEMP\barbatos-pack" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # validate, build, sign, verify, package; the password is read from BARBATOS_CERT_PASSWORD by the profile
      - name: Build the installer
        env:
          BARBATOS_CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: barbatos-pack release --profile packaging/Barbatos.Pallas.json --strict

      - name: Upload the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: barbatos-pallas-installer
          path: artifacts\installer\*-setup.exe

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Barbatos Pallas ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/installer/*-setup.exe
