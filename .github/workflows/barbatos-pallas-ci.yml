name: barbatos-pallas-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test and pack (Windows, x64)
    # The WPF application only builds on Windows; everything else is covered on Linux and ARM64 below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Barbatos.Pallas.slnx

      - name: Build
        run: dotnet build Barbatos.Pallas.slnx --configuration Release --no-restore

      # Runs every test project on net8.0, net9.0 and net10.0 (Microsoft.Testing.Platform, see global.json).
      - name: Test
        run: dotnet test --solution Barbatos.Pallas.slnx --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      # A test project that failed to build for one framework is silently absent from a --no-build run while the
      # summary still reads "Passed!". Count the result files instead of trusting the summary.
      - name: Verify every test assembly ran
        shell: pwsh
        run: |
          $expected = 36   # 12 test projects x 3 target frameworks
          $trx = @(Get-ChildItem -Path TestResults -Filter *.trx -Recurse)
          if ($trx.Count -lt $expected) { throw "Expected $expected test result files, found $($trx.Count)." }
          Write-Host "$($trx.Count) test result files."

      # Roadmap gate: a mutation score of at least 90% per package. Each stryker-config.json sets break = 90, so a lower
      # score fails the step. Stryker builds its own Debug output and does not touch the Release build packed below.
      - name: Restore tools
        run: dotnet tool restore

      - name: Mutation testing (Numerics)
        working-directory: tests/Barbatos.Pallas.Numerics.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Numerics

      - name: Mutation testing (Expressions)
        working-directory: tests/Barbatos.Pallas.Expressions.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Expressions

      - name: Mutation testing (Engine)
        working-directory: tests/Barbatos.Pallas.Engine.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Engine

      - name: Mutation testing (LinearAlgebra)
        working-directory: tests/Barbatos.Pallas.LinearAlgebra.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/LinearAlgebra

      - name: Mutation testing (Statistics)
        working-directory: tests/Barbatos.Pallas.Statistics.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Statistics

      - name: Mutation testing (Solvers)
        working-directory: tests/Barbatos.Pallas.Solvers.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Solvers

      - name: Mutation testing (Spreadsheet)
        working-directory: tests/Barbatos.Pallas.Spreadsheet.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Spreadsheet

      # Data is only static initialization, whose mutants the MTP runner cannot switch; its tests check every value
      # against its defining relation instead.
      - name: Mutation testing (DependencyInjection)
        working-directory: tests/Barbatos.Pallas.DependencyInjection.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/DependencyInjection

      - name: Mutation testing (Presentation)
        working-directory: tests/Barbatos.Pallas.Presentation.Tests
        run: dotnet stryker --skip-version-check --output ../../StrykerOutput/Presentation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: StrykerOutput/*/reports/*
          if-no-files-found: ignore

      - name: Pack core packages
        run: dotnet pack Barbatos.Pallas.slnx --configuration Release --no-build --output artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/**/*.trx

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*
          if-no-files-found: error

  portable:
    name: Test (${{ matrix.os }})
    # Invariant I5 (docs/PRECISION.md): results must agree on every OS and architecture. System.Math calls the platform C
    # runtime (UCRT on Windows, glibc on Linux), so the Numerics accuracy tests matter most here. Every test project
    # except the WPF host runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Architecture tests
        run: dotnet test --project tests/Barbatos.Pallas.Architecture.Tests --configuration Release

      - name: Conformance tests
        run: dotnet test --project tests/Barbatos.Pallas.Conformance.Tests --configuration Release

      - name: Numerics tests
        run: dotnet test --project tests/Barbatos.Pallas.Numerics.Tests --configuration Release

      - name: Expressions tests
        run: dotnet test --project tests/Barbatos.Pallas.Expressions.Tests --configuration Release

      - name: Engine tests
        run: dotnet test --project tests/Barbatos.Pallas.Engine.Tests --configuration Release

      - name: LinearAlgebra tests
        run: dotnet test --project tests/Barbatos.Pallas.LinearAlgebra.Tests --configuration Release

      - name: Statistics tests
        run: dotnet test --project tests/Barbatos.Pallas.Statistics.Tests --configuration Release

      - name: Solvers tests
        run: dotnet test --project tests/Barbatos.Pallas.Solvers.Tests --configuration Release

      - name: Spreadsheet tests
        run: dotnet test --project tests/Barbatos.Pallas.Spreadsheet.Tests --configuration Release

      - name: Data tests
        run: dotnet test --project tests/Barbatos.Pallas.Data.Tests --configuration Release

      - name: Dependency injection tests
        run: dotnet test --project tests/Barbatos.Pallas.DependencyInjection.Tests --configuration Release

      - name: Presentation tests
        run: dotnet test --project tests/Barbatos.Pallas.Presentation.Tests --configuration Release
