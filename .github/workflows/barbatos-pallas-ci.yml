name: barbatos-pallas-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test and pack (Windows, x64)
    # The only job: the application ships on Windows alone (maintainer, 23 Sep 2026). The packages stay platform-neutral -
    # net8.0, net9.0 and net10.0 with no Windows API (CA1416 and Architecture.Tests) - but are only run here.
    #
    # The benchmark gate and the mutation gates are not run here (maintainer, 25 Sep 2026): on the runner the benchmarks
    # took 10.5 minutes and one package of ten had not finished its mutation run after 5.5, against 2.5 for the build and
    # 1 for the tests. They are run on the maintainer's machine before every release (docs/RELEASING.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Barbatos.Pallas.slnx

      - name: Build
        run: dotnet build Barbatos.Pallas.slnx --configuration Release --no-restore

      # Runs every test project on net8.0, net9.0 and net10.0 (Microsoft.Testing.Platform, see global.json).
      - name: Test
        run: dotnet test --solution Barbatos.Pallas.slnx --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      # A test project that failed to build for one framework is silently absent from a --no-build run while the
      # summary still reads "Passed!". Count the result files instead of trusting the summary.
      - name: Verify every test assembly ran
        shell: pwsh
        run: |
          $expected = 40   # 13 test projects x 3 target frameworks, plus Wpf.Tests on Windows only
          $trx = @(Get-ChildItem -Path TestResults -Filter *.trx -Recurse)
          if ($trx.Count -lt $expected) { throw "Expected $expected test result files, found $($trx.Count)." }
          Write-Host "$($trx.Count) test result files."

      # Packing is by solution: IsPackable decides what comes out, and only Engine and DependencyInjection set it. It is
      # not --no-build: a package finds the libraries it carries by resolving its references, which builds them - up to
      # date after the Release build above, so nothing compiles again - and a --no-build pack fails them with NETSDK1085.
      # Telling it not to build them loses their XML documentation and symbols from the packages (measured 25 Sep 2026).
      - name: Pack the published packages
        run: dotnet pack Barbatos.Pallas.slnx --configuration Release --output artifacts/packages

      # A package can pack cleanly and still be unusable - an assembly it should carry left out, a type that does not
      # load. Two programs outside the repository install the packages from artifacts/packages and calculate with them
      # on net8.0, net9.0 and net10.0; the script also fails if any other package came out of the pack.
      - name: Test the packages as a user installs them
        shell: pwsh
        run: ./build/Test-Packages.ps1 -PackageDirectory artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/**/*.trx

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*
          if-no-files-found: error
